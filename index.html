<!DOCTYPE html>

    <!-- Primary Meta Tags -->

    <meta name="author" content="RVS Bespoke Furniture Ltd" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Geographic Meta Tags (Local SEO) -->
    <meta name="geo.region" content="GB-WNM" />
    <meta name="geo.placename" content="Windsor" />
    <meta name="geo.position" content="51.4785;-0.6168" />
    <meta name="ICBM" content="51.4785, -0.6168" />

    <!-- Open Graph / Facebook (sitewide only — og:title/description/url are set per-route by each page's Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rvsbespoke.co.uk/images/hero.jpeg" />
    <meta property="og:image:width" content="945" />
    <meta property="og:image:height" content="686" />
    <meta property="og:image:alt" content="Bespoke fitted furniture handcrafted by RVS Bespoke in Windsor" />
    <meta property="og:site_name" content="RVS Bespoke" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter (sitewide only — twitter:title/description/url are set per-route by each page's Helmet) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rvsbespoke.co.uk/images/hero.jpeg" />

    <!-- Additional SEO -->
    <meta name="format-detection" content="telephone=yes" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Preload LCP hero image for fast rendering -->

         prerendered routes, so preloading the homepage hero forced every
         other page to download a 109 KB image it never renders. Each page's
         own hero carries fetchPriority="high" instead. -->

    <!--
      WARNING: the empty #root element immediately below is load-bearing.
      vite-react-ssg only injects its client hydration script
      (window.__VITE_REACT_SSG_HASH__) when it can find that exact empty
      element by a plain string search — so do NOT quote the tag itself
      anywhere above this comment, or the search will match inside this
      comment instead of the real element and silently break hydration.
      Any other content in that element forces vite-react-ssg's AST-based
      fallback path instead, which omits the hydration script entirely.
      Without it, every client-side navigation fetches a nonexistent
      static-loader-data-manifest file and crashes with a hydration or
      JSON parse error. This previously held a "pre-render shell" for
      instant first paint, which broke this exact mechanism in
      production. Every route is already fully prerendered by the SSG
      build, so there is nothing this element needs to show before React
      mounts — leave it empty.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
